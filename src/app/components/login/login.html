<div class="pf-auth-wrap">

  <div class="pf-auth-image d-none d-md-block"
       style="background-image:url('/imagenes/auth-bg.jpg'); background-size:cover; background-position:center;">
    <span class="pf-auth-badge-iot">IOT · SMART FEEDER</span>
    <div class="pf-auth-caption">
      <img src="imagenes/pawfeeder-mark.png" alt="PawFeeder" style="height:2.6rem;margin-bottom:1rem;" />
      <h2 class="fw-bold mb-1" style="color:#fff;">Paw<span style="color:#E8A838;">Feeder</span></h2>
      <p class="mb-0 opacity-75">Alimentación inteligente para tu mascota.</p>
    </div>
  </div>

  <div class="pf-auth-form">
    <div class="pf-form-box">
      <div class="text-center mb-4 d-md-none">
        <img src="imagenes/pawfeeder-mark.png" alt="PawFeeder" style="height:3rem;" class="mb-2" />
      </div>

      <span class="pf-auth-eyebrow">BIENVENIDO DE VUELTA</span>
      <h2 class="pf-auth-title mb-1 mt-2">Hora de alimentar<br />a tu peludo</h2>
      <p class="pf-auth-sub mb-4">Inicia sesión para controlar tu dispensador.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <div class="mb-3">
          <label class="form-label fw-semibold small text-uppercase" style="letter-spacing:0.06em;">Correo</label>
          <input type="email" formControlName="email" class="form-control pf-input" placeholder="tu@correo.com">
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold small text-uppercase" style="letter-spacing:0.06em;">Contraseña</label>
          <input type="password" formControlName="password" class="form-control pf-input" placeholder="••••••••">
        </div>

        @if (errorMsg) {
          <div class="alert alert-danger py-2 small">{{ errorMsg }}</div>
        }

        <button type="submit" class="btn btn-pf-block mb-3">Iniciar sesión →</button>
      </form>

      <p class="text-center text-muted small mb-0">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="text-decoration-none fw-semibold" style="color:var(--pf-primary);">Regístrate</a>
      </p>
    </div>
  </div>
</div>
